[project]
name = "trip-planner-ai"
version = "0.1.0"
description = "Multi-Agent AI Trip Planner powered by LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "airportsdata>=20260803",
    "certifi>=2024.2.2",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.17",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.21",
    "nest-asyncio>=1.6.0",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.0.1",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "uvicorn>=0.34.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
